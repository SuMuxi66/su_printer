    pt_BR: "su_printer"
    ja_JP: "su_printer"
  description:
    en_US: "Send print jobs to network laser and thermal printers"
    zh_Hans: "向网络激光与热敏打印机发送打印任务"
    pt_BR: "Envie trabalhos de impressão para impressoras de rede laser e térmicas"
    ja_JP: "ネットワークレーザー／サーマルプリンターへ印刷ジョブを送信"
  icon: "icon.svg"

